[package]
name = "age_of_lauyyii"
version = "0.1.0"
edition = "2021"
description = "Guía liviana para Age of Empires II: civilizaciones, build orders, timings y consejos"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = "0.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
